[package]
name = "bevy_radioactive"
version = "0.4.0"
edition = "2024"
rust-version = "1.97.1"
description = "Source-specific reactive state and event routing for Bevy 0.20 BSN scenes"
readme = "README.md"
publish = false
keywords = ["bevy", "ecs", "gamedev", "reactive", "ui"]
categories = ["game-development", "gui"]

[features]
default = ["ui"]
## Orders the runtime before UI layout and enables `webby::text` and `webby::show`.
ui = ["bevy/bevy_ui", "bevy/ghost_nodes"]
## Full Bevy with Feathers, for the `examples/comparison` examples.
comparison = ["ui", "bevy/ui", "bevy/bevy_feathers"]

[workspace]
members = ["macros"]

[dependencies]
bevy_radioactive_macros = { path = "macros", version = "0.4.0" }
bevy = { version = "0.20", default-features = false, features = ["bevy_scene"] }

[dev-dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "bevy_scene",
    "bevy_ui_widgets",
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
type_complexity = "allow"

[[example]]
name = "reactivity_radioactive"
path = "examples/comparison/reactivity/radioactive.rs"
required-features = ["comparison"]

[[example]]
name = "reactivity_bevy"
path = "examples/comparison/reactivity/bevy.rs"
required-features = ["comparison"]

[[example]]
name = "subscription_radioactive"
path = "examples/comparison/subscription/radioactive.rs"
required-features = ["comparison"]

[[example]]
name = "subscription_bevy"
path = "examples/comparison/subscription/bevy.rs"
required-features = ["comparison"]

[[example]]
name = "webby_radioactive"
path = "examples/comparison/webby/radioactive.rs"
required-features = ["comparison"]

[[example]]
name = "webby_bevy"
path = "examples/comparison/webby/bevy.rs"
required-features = ["comparison"]

[[example]]
name = "coat_radioactive"
path = "examples/comparison/coat/radioactive.rs"
required-features = ["comparison"]

[[example]]
name = "coat_bevy"
path = "examples/comparison/coat/bevy.rs"
required-features = ["comparison"]
