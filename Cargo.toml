[package]
name = "bevy_radioactive"
version = "0.6.0"
edition = "2024"
rust-version = "1.97.1"
description = "Source-specific reactive state and event routing for Bevy 0.20 BSN scenes"
readme = "README.md"
publish = false
keywords = ["bevy", "ecs", "gamedev", "reactive", "ui"]
categories = ["game-development", "gui"]

[features]
default = ["reactive", "subscribe", "hooks", "view", "ui"]
## `watch`, `handle`, `when`, `switch`, `each`: one ECS-native API for reactivity and control flow.
reactive = []
## `subscribe_to`, `bind_event`: react to entity events on other entities.
subscribe = []
## `#[component]`: React-style function components with hooks.
hooks = []
## `view!`: fine-grained templates with signals.
view = []
## Runs updates before UI layout and makes component hosts and regions `GhostNode`s.
ui = ["bevy/bevy_ui", "bevy/ghost_nodes"]
## Full Bevy with Feathers, for the `examples/comparison` examples.
comparison = ["ui", "bevy/ui", "bevy/bevy_feathers"]

[workspace]
members = ["macros"]

[dependencies]
bevy_radioactive_macros = { path = "macros", version = "0.6.0" }
bevy = { version = "0.20", default-features = false, features = ["bevy_scene", "bevy_log"] }

[dev-dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "bevy_scene",
    "bevy_log",
    "bevy_ui_widgets",
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
type_complexity = "allow"
## Each style is meant to be glob-imported: `use bevy_radioactive::view::*`.
wildcard_imports = "allow"

[[example]]
name = "reactive_counters"
path = "examples/reactive_counters.rs"
required-features = ["reactive"]

[[example]]
name = "reactive_todos"
path = "examples/reactive_todos.rs"
required-features = ["reactive"]

[[example]]
name = "subscribe"
path = "examples/subscribe.rs"
required-features = ["subscribe"]

[[example]]
name = "hooks_counter"
path = "examples/hooks_counter.rs"
required-features = ["hooks"]

[[example]]
name = "hooks_todos"
path = "examples/hooks_todos.rs"
required-features = ["hooks"]

[[example]]
name = "view_tabs"
path = "examples/view_tabs.rs"
required-features = ["view"]

[[example]]
name = "view_todos"
path = "examples/view_todos.rs"
required-features = ["view"]

[[example]]
name = "comparison_bevy"
path = "examples/comparison/bevy.rs"
required-features = ["comparison"]

[[example]]
name = "comparison_reactive"
path = "examples/comparison/reactive.rs"
required-features = ["comparison", "reactive"]

[[example]]
name = "comparison_subscribe"
path = "examples/comparison/subscribe.rs"
required-features = ["comparison", "subscribe"]

[[example]]
name = "comparison_hooks"
path = "examples/comparison/hooks.rs"
required-features = ["comparison", "hooks"]

[[example]]
name = "comparison_view"
path = "examples/comparison/view.rs"
required-features = ["comparison", "view"]

[[bench]]
name = "reactive"
harness = false
required-features = ["reactive"]
